<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07040a">
<title>Maker Forge</title>
<style>
:root{--bg:#f7e9ef;--panel:#fff8fb;--ink:#2a0f1f;--mute:#8a5a72;--line:#ecd0dd;--accent:#c8336f;--on:#fff;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
:root[data-theme=dark]{--bg:#07040a;--panel:#110a12;--ink:#ffeef5;--mute:#c49ab0;--line:#2e1a28;--accent:#ff7ab0;--on:#1a0712}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
#view{position:relative;flex:0 0 54vh;min-height:300px;background:var(--bg)}
#c{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
header{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;pointer-events:none}
header>*{pointer-events:auto}
h1{margin:0;font:italic 400 32px/1 var(--serif);pointer-events:none}
.util{display:flex;flex-wrap:wrap;gap:2px 16px}
header .util{justify-content:flex-end}
.util button{border:0;border-bottom:1px solid transparent;background:none;padding:4px 0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
header .util{gap:6px}header .util button{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:5px 13px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.tools svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.val{display:flex;align-items:baseline;gap:4px}
.val input{width:64px;padding:1px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;text-align:right;-moz-appearance:textfield;appearance:textfield}
.val input::-webkit-inner-spin-button,.val input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.val input:focus{border-color:var(--accent)}
.val em{min-width:1.6em;font-style:normal;color:var(--mute);font-size:13px}
.util button:hover{color:var(--accent);border-color:var(--accent)}
#presets{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 12px;pointer-events:none}
#presets button{pointer-events:auto;display:flex;align-items:center;gap:7px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 13px 4px 9px;font:inherit;font-size:13px;cursor:pointer}
#presets button:hover{border-color:var(--accent)}
#presets svg{fill:var(--accent)}
#stats{position:absolute;left:18px;bottom:8px;color:var(--mute);font-size:12px;pointer-events:none}
#panel{flex:1;overflow:auto;padding:4px 22px 36px}
h2{margin:24px 0 12px;padding-top:12px;border-top:1px solid var(--line);font:italic 400 19px/1.2 var(--serif)}
#sliders>h2:first-child{border-top:0;margin-top:16px;padding-top:0}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px;margin:0 0 10px}
.row output{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{grid-column:1/3;width:100%;height:22px;margin:0;background:none;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.opt label{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;transition:background .15s,border-color .15s}
.opt span::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mute)}
.opt label:hover span{border-color:var(--accent)}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on)}
.opt input:checked+span::before{background:var(--on);border-color:var(--on)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.opt span{transition:none}}
#glz{width:32px;height:32px;padding:0;border:2px solid var(--line);border-radius:50%;background:none;cursor:pointer;grid-column:auto}#glz::-webkit-color-swatch-wrapper{padding:0}#glz::-webkit-color-swatch{border:0;border-radius:50%}#glz::-moz-color-swatch{border:0;border-radius:50%}
#eh{width:84px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:right;grid-column:auto}
.act{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.pill{font:inherit;cursor:pointer;background:none;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:8px 18px}
.pill.main{background:var(--accent);color:var(--on)}
.pill:hover{filter:brightness(1.12)}
#inf{color:var(--mute);font-size:13px;margin-bottom:14px}
:is(#gens){margin:14px 0 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#gens summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;font:italic 400 21px/1.2 var(--serif)}
#gens summary::-webkit-details-marker{display:none}
#gens summary::after{content:"";width:8px;height:8px;margin-right:3px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .2s}
#gens[open] summary::after{transform:rotate(-135deg)}
#glist{border-top:1px solid var(--line)}
#glist button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
#glist button:last-child{border-bottom:0}
#glist button:hover{background:var(--panel)}
#glist b{font-weight:600}
#glist small{color:var(--mute);font-size:12px}
@media(prefers-reduced-motion:reduce){#gens summary::after{transition:none}}
#intro{position:fixed;inset:0;z-index:100;background:#050307;color:#ffeef5;overflow:hidden;transition:opacity .9s ease,transform .9s ease}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
#intro canvas{position:absolute;inset:0}
#ig{filter:blur(5px) brightness(1.3);mix-blend-mode:screen;opacity:.75}
.leaving .itxt{opacity:0;transition:opacity .5s}
.itxt{position:absolute;z-index:2;left:0;right:0;bottom:6vh;padding:0 20px;text-align:center}
.itxt h2{margin:0;padding:0;border:0;font:italic 400 clamp(32px,6vw,54px)/1.1 var(--serif);text-shadow:0 0 26px rgba(255,110,170,.55)}
.itxt p{margin:8px 0 20px;color:#f5a3c6;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3em}
#enter{opacity:0;pointer-events:none;transition:opacity .6s;border:0;border-radius:999px;padding:11px 26px;background:#ff7ab0;color:#1a0712;font:inherit;font-weight:600;cursor:pointer}
#enter.show{opacity:1;pointer-events:auto}
@media(prefers-reduced-motion:reduce){#intro{transition:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(min-width:860px){body{flex-direction:row-reverse}#view{flex:1;min-height:0}#panel{flex:0 0 380px;border-right:1px solid var(--line)}#presets{bottom:38px}}
</style>
</head>
<body>
<div id="intro" role="dialog" aria-label="Maker Forge"><canvas id="ig"></canvas><canvas id="ic"></canvas>
  <div class="itxt"><h2>Maker Forge</h2><p data-i="intro_tag">let it bloom</p><button id="enter" data-i="intro_enter">Enter the forge</button></div></div>
<div id="view"><canvas id="c"></canvas>
  <header><h1>Maker Forge</h1>
    <nav class="util"><button id="lang"></button><button id="theme"></button><button id="undo" data-i="undo"></button><button id="redo" data-i="redo"></button><button id="rnd" data-i="rnd"></button></nav></header>
  <div id="presets"></div><div id="stats"></div></div>
<aside id="panel"><details id="gens"><summary><span id="gname" data-i="g_vase"></span></summary><div id="glist"></div></details><div id="sliders"></div>
  <h2 data-i="sLook"></h2>
  <div class="opt"><label><input type="checkbox" id="wire"><span data-i="wire"></span></label><label><input type="checkbox" id="spin" checked><span data-i="spin"></span></label><label><input type="checkbox" id="cut"><span data-i="cut"></span></label><label><input type="checkbox" id="over"><span data-i="over"></span></label></div>
  <div class="row"><label for="glz" data-i="glaze"></label><input type="color" id="glz" value="#f08cb8"></div>
  <h2 data-i="sOut"></h2>
  <div class="row"><label for="eh" data-i="eh"></label><input type="number" id="eh" min="10" max="1000"></div>
  <div class="act"><button class="pill main" id="stl" data-i="stl"></button><button class="pill" id="glb" data-i="glb"></button><button class="pill" id="obj" data-i="obj"></button></div>
  <div id="inf"></div>
  <nav class="tools"><button id="copy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span data-i="copy"></span></button><button id="save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg><span data-i="save"></span></button><button id="load"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 19h14"/></svg><span data-i="load"></span></button><button id="png"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg><span data-i="png"></span></button><input type="file" id="file" accept=".json" hidden></nav>
</aside>
<script>
function roseField(t,cols,rows,cw,ch,W,H,reduce,wind){
  const LU=new Float32Array(cols*rows).fill(-1),ZB=new Float32Array(cols*rows).fill(-1e9),ID=new Int16Array(cols*rows).fill(-1);
  const b=reduce?1:Math.min(1,t/4.6),bloom=1-Math.pow(1-b,3),rot=(reduce?.5:t*.3)+.4,tilt=1.0;
  const cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(tilt),st=Math.sin(tilt);
  const S=.4*Math.min(W,H)/1.5,NP=36,SS=38,UU=32,sm=x=>x*x*(3-2*x),cl=x=>Math.max(0,Math.min(1,x));
  for(let i=0;i<NP;i++){
    const q=i/(NP-1),th=i*2.39996,cs=Math.cos(th),sn=Math.sin(th),o=sm(cl((bloom-(1-q)*.4)/.6));
    const rho0=(.04+.5*Math.pow(q,.85))*(.55+.45*o),L=(.5+.8*Math.pow(q,.6))*(.35+.65*Math.min(1,bloom*1.3)),Wd=(.28+.5*q)*(.6+.4*o);
    const phi=(.1+.08*q)*(1-o)+(.2+1.35*Math.pow(q,.8))*o,ds=L/SS;
    const rj=(i*.6180339)%1,pd=(1-q)*.7+rj*.3,bx=rho0*cs,bz=rho0*sn,BX=bx*cr+bz*sr,BZ=-bx*sr+bz*cr,BY=-.45*ct-BZ*st;
    let r=rho0,y=0;
    for(let a=0;a<=SS;a++){
      const s=a/SS,cv=Math.max(0,s-.78),ang=phi*Math.pow(s,.9)+o*6.6*cv*cv,
        w=Wd*Math.pow(Math.sin(Math.PI*Math.pow(s,.62)),.7),Nr=-Math.cos(ang),Ny=Math.sin(ang),ao=.38+.62*Math.pow(s,.7);
      for(let k=0;k<UU;k++){
        const u=-1+2*k/(UU-1),d=u*w,lift=.7*d*d,pr=r+lift*Nr,py=y+lift*Ny;
        const x=pr*cs-d*sn,z=pr*sn+d*cs,yy=py-.45,tl=.98*d;
        let nx=Nr*cs+sn*tl,ny=Ny,nz=Nr*sn-cs*tl;const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
        const X1=x*cr+z*sr,Z1=-x*sr+z*cr,Y2=yy*ct-Z1*st,Z2=yy*st+Z1*ct;
        const nX=nx*cr+nz*sr,nZ1=-nx*sr+nz*cr,nY=ny*ct-nZ1*st,nZ=ny*st+nZ1*ct;
        const dot=Math.abs(nX*-.35+nY*.6+nZ*.72)/.99;
        const edge=Math.max(Math.pow(Math.abs(u),10),Math.pow(s,14)),lum=cl(Math.pow(.88*((.14+.86*dot)*ao*(.42+.58*q)*(.65+.35*cl((Z2+1.1)/2.2))+.5*edge*ao+.04),1.15));
        let X=X1,Yv=Y2,fade=1;
        if(wind>0){const rs=((i*131+a*17+k*31)%97)/97,ts=cl((wind-pd-(1-s)*.35-rs*.25)/1.5);
          if(ts>0){if(((i*53+a*29+k*7)%89)/89<ts*.55)continue;
            const es=Math.pow(ts,1.7),th2=es*(2.2+rj*2.4),fl=Math.cos(es*(3+rj*3)),c2=Math.cos(th2),s2=Math.sin(th2),rx=X-BX,ry=(Yv-BY)*fl;
            X=BX+rx*c2-ry*s2+es*(5.2+rj*1.8);Yv=BY+rx*s2+ry*c2+es*.9+Math.sin(wind*3.1+i*1.7)*es*.6+Math.sin(wind*7+i*2.3+s*3)*.25*es;fade=1-.6*ts}}
        const ix=Math.floor(cols/2+X*S/cw),iy=Math.floor((H*.47-Yv*S)/ch);
        if(ix>=0&&ix<cols&&iy>=0&&iy<rows){const c=iy*cols+ix;if(Z2>ZB[c]){ZB[c]=Z2;LU[c]=lum*fade;ID[c]=i}}
      }
      r+=Math.sin(ang)*ds;y+=Math.cos(ang)*ds;
    }
  }
  const O=LU.slice();
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const c=y*cols+x;if(O[c]<0)continue;const z=ZB[c];let occ=false,edge=false;
    for(let d=0;d<4;d++){const xx=x+(d===0?-1:d===1?1:0),yy=y+(d===2?-1:d===3?1:0);
      if(xx<0||xx>=cols||yy<0||yy>=rows)continue;const n=yy*cols+xx;
      if(O[n]>=0&&ID[n]!==ID[c]){if(ZB[n]>z)occ=true;else edge=true}}

(function(){
  const el=document.getElementById("intro"),cv=document.getElementById("ic"),gl=document.getElementById("ig"),ctx=cv.getContext("2d"),gx=gl.getContext("2d"),en=document.getElementById("enter");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,NB=14;
  const RAMP=[" ",".,'",":;-","i!l","t+=","ox*","zXO","#%&","@8M"],STOPS=[[120,24,78],[190,40,110],[240,86,152],[255,156,200],[255,214,232],[255,246,250]];
  let cols,rows,cw,ch,dpr,cwp,chp,atlas,idxOf={},W,H,done=false;const t0=performance.now();
  function col(l){const x=l*(STOPS.length-1),i=Math.min(STOPS.length-2,Math.floor(x)),f=x-i,a=STOPS[i],b=STOPS[i+1];return a.map((v,k)=>Math.round(v+(b[k]-v)*f))}
  function setup(){
    dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cols=Math.max(72,Math.min(300,Math.floor(W/6.5)));cw=W/cols;const fs=cw/.6;ch=fs*1.18;rows=Math.floor(H/ch);
    [cv,gl].forEach(c=>{c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+"px";c.style.height=H+"px"});
    cwp=Math.ceil(cw*dpr);chp=Math.ceil(ch*dpr);
    const chars=[...new Set(RAMP.join(""))].filter(c=>c!==" ");
    atlas=document.createElement("canvas");atlas.width=chars.length*cwp;atlas.height=NB*chp;
    const a=atlas.getContext("2d");a.font=Math.round(fs*dpr)+"px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace";a.textAlign="center";
    chars.forEach((c,ci)=>{idxOf[c]=ci;for(let b=0;b<NB;b++){a.fillStyle="rgb("+col((b+.5)/NB).join(",")+")";a.fillText(c,ci*cwp+cwp/2,b*chp+chp*.78)}})}
  function draw(t,w){
    ctx.clearRect(0,0,cv.width,cv.height);gx.clearRect(0,0,gl.width,gl.height);
    const F=roseField(t,cols,rows,cw,ch,W,H,reduce,w||0);
    for(let iy=0;iy<rows;iy++)for(let ix=0;ix<cols;ix++){const l=F[iy*cols+ix];if(l<0)continue;
      const lev=Math.max(2,Math.min(8,Math.floor(l*8.99)));
      const v=RAMP[lev],h=((ix*73856093)^(iy*19349663))>>>0,c=v[(h+Math.floor(t*2.4+h%7))%v.length],bk=Math.min(NB-1,Math.floor((.2+.8*l)*NB));
      ctx.drawImage(atlas,idxOf[c]*cwp,bk*chp,cwp,chp,Math.round(ix*cw*dpr),Math.round(iy*ch*dpr),cwp,chp)}
    gx.drawImage(cv,0,0)}
  let blow=0;
  function close(){if(done||blow)return;if(reduce){done=true;el.classList.add("out");setTimeout(()=>el.remove(),1000);return}blow=performance.now();el.classList.add("leaving")}
  function loop(now){if(done)return;const t=(now-t0)/1000,w=blow?(now-blow)/1000:0;
    draw(t,w);if(t>3.8)en.classList.add("show");if(!blow&&t>10)close();
    if(w>2.4)el.classList.add("out");if(w>3.7){done=true;el.remove();return}requestAnimationFrame(loop)}
  setup();
  if(reduce){draw(0);en.classList.add("show")}else requestAnimationFrame(loop);
  addEventListener("resize",()=>{if(!done){setup();if(reduce)draw(0)}});
  en.onclick=close;
  addEventListener("keydown",e=>{if(e.key==="Escape"||e.key==="Enter"||e.key===" ")close()});
  el.addEventListener("click",()=>{if(en.classList.contains("show"))close()});
})();
</script>

<script>
let P={h:160,rb:36,rm:56,tm:.4,rn:28,rl:34,ribs:12,rd:.07,tw:90,wall:2.4,floor:3,res:96,er:2};
let DEF=[
 ["h","Height",60,300,1,"mm"],["rb","Base radius",15,80,1,"mm"],["rm","Belly radius",15,100,1,"mm"],
 ["tm","Belly height",.1,.7,.01,""],["rn","Neck radius",10,70,1,"mm"],["rl","Lip radius",10,80,1,"mm"],
 ["ribs","Ribs",0,40,1,""],["rd","Rib depth",0,.25,.01,""],["tw","Twist",-360,360,5,"°"],

let PRESETS={
 Amphora:{h:190,rb:30,rm:58,tm:.45,rn:24,rl:38,ribs:0,rd:0,tw:0,wall:2.6,floor:3,res:96},
 Cylinder:{h:140,rb:36,rm:38,tm:.4,rn:37,rl:38,ribs:0,rd:0,tw:0,wall:2.4,floor:3,res:96},
 Bulb:{h:120,rb:26,rm:62,tm:.3,rn:16,rl:22,ribs:0,rd:0,tw:0,wall:2.4,floor:3,res:96},
 Twisted:{h:180,rb:34,rm:50,tm:.42,rn:30,rl:36,ribs:7,rd:.14,tw:180,wall:2.4,floor:3,res:160},

/* ---------- geometry ---------- */
let buildMesh;function buildVase(){
  const M=LOW?Math.min(P.res,48):P.res,N=LOW?30:120,pos=[],idx=[],H=P.h,TW=P.tw*Math.PI/180;
  const pts=[[0,P.rb],[P.tm,P.rm],[.82,P.rn],[1,P.rl]];
  const R=t=>{let k=0;while(k<2&&t>pts[k+1][0])k++;const[a,b]=[pts[k],pts[k+1]];

  const ee=Math.min(P.er,P.wall*.8,H*.2),fil=t=>{const y=t*H,d=Math.min(y,H-y);return ee<.01||d>=ee?0:ee-Math.sqrt(ee*ee-(ee-d)*(ee-d))};

let GRP={};
const sl=document.getElementById("sliders");
function buildSliders(){sl.innerHTML="";DEF.forEach(([k,label,min,max,step,unit])=>{
  if(GRP[k])sl.insertAdjacentHTML("beforeend",`<h2 data-i="${GRP[k]}"></h2>`);const d=document.createElement("div");d.className="row";
  d.innerHTML=`<label for="s_${k}" data-i="${k}"></label><span class="val"><input type="number" id="n_${k}" min="${min}" max="${max}" step="${step}" aria-label="${label}"><em>${unit}</em></span><input type="range" id="s_${k}" min="${min}" max="${max}" step="${step}">`;
  sl.appendChild(d);
  const i=d.querySelector("input[type=range]"),nb=d.querySelector("input[type=number]");
  nb.oninput=()=>{const v=parseFloat(nb.value);if(isFinite(v)&&v>=min&&v<=max){P[k]=v;i.value=v;refresh()}};
  nb.onchange=()=>{let v=parseFloat(nb.value);if(!isFinite(v))v=P[k];v=Math.min(max,Math.max(min,v));P[k]=v;nb.value=v;syncAll();refresh()};
  i.oninput=()=>{P[k]=+i.value;sync(k);refresh()};
});}
function sync(k){const n=document.getElementById("n_"+k);if(document.activeElement!==n)n.value=P[k]}
function syncAll(){DEF.forEach(([k])=>{document.getElementById("s_"+k).value=P[k];sync(k)})}
function buildPresets(){const pe=document.getElementById("presets");pe.innerHTML="";Object.keys(PRESETS).forEach(n=>{const b=document.createElement("button");b.innerHTML=(G.sil?sil(PRESETS[n]):"")+`<span data-i="${n}"></span>`;
  b.onclick=()=>{Object.assign(P,PRESETS[n]);syncAll();refresh()};pe.appendChild(b)})}
function sil(p){const pts=[[0,p.rb],[p.tm,p.rm],[.82,p.rn],[1,p.rl]];
  const R=t=>{let k=0;while(k<2&&t>pts[k+1][0])k++;const a=pts[k],b=pts[k+1],u=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(1-Math.cos(Math.PI*u))/2};
  const sc=44/p.h;let l="",r="";
  for(let i=0;i<=20;i++){const t=i/20,y=(1-t)*44,w=R(t)*sc;l+=`${i?"L":"M"}${30-w},${y} `;r=`L${30+w},${y} `+r}
  return `<svg viewBox="0 0 60 46" width="30" height="23" aria-hidden="true"><path d="${l}${r}Z"/></svg>`}

/* ---------- export ---------- */
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportSTL(){
  const g=mesh.geometry,p=g.attributes.position.array,ix=g.index.array,n=ix.length/3;
  const buf=new ArrayBuffer(84+n*50),dv=new DataView(buf);
  new TextEncoder().encodeInto("Vase Forge",new Uint8Array(buf,0,80));dv.setUint32(80,n,true);
  const s=S(),T=i=>[p[i*3]*s,-p[i*3+2]*s,p[i*3+1]*s]; // Y-up to Z-up, proper rotation
  for(let f=0,o=84;f<n;f++,o+=50){
    const a=T(ix[f*3]),b=T(ix[f*3+1]),c=T(ix[f*3+2]);
    const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
    let nx=u[1]*v[2]-u[2]*v[1],ny=u[2]*v[0]-u[0]*v[2],nz=u[0]*v[1]-u[1]*v[0];
    const l=Math.hypot(nx,ny,nz)||1;[nx,ny,nz].forEach((q,i)=>dv.setFloat32(o+i*4,q/l,true));
    [a,b,c].forEach((q,k)=>q.forEach((x,i)=>dv.setFloat32(o+12+k*12+i*4,x,true)));
  }
  save(new Blob([buf],{type:"model/stl"}),G.id+".stl");
}
function exportGLB(){
  const g=mesh.geometry,pos=g.attributes.position.array,nor=g.attributes.normal.array,ix=g.index.array;
  const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  for(let i=0;i<pos.length;i++){mn[i%3]=Math.min(mn[i%3],pos[i]);mx[i%3]=Math.max(mx[i%3],pos[i])}
  const pl=pos.byteLength,nl=nor.byteLength,il=ix.byteLength,bin=pl+nl+il;
  const json={asset:{version:"2.0",generator:"Vase Forge"},scene:0,scenes:[{nodes:[0]}],nodes:[{mesh:0,scale:[S(),S(),S()]}],
    meshes:[{primitives:[{attributes:{POSITION:0,NORMAL:1},indices:2,material:0}]}],
    materials:[{pbrMetallicRoughness:{baseColorFactor:[...new THREE.Color(glz.value).toArray(),1],metallicFactor:.05,roughnessFactor:.35},doubleSided:true}],
    buffers:[{byteLength:bin}],
    bufferViews:[{buffer:0,byteOffset:0,byteLength:pl,target:34962},{buffer:0,byteOffset:pl,byteLength:nl,target:34962},{buffer:0,byteOffset:pl+nl,byteLength:il,target:34963}],
    accessors:[{bufferView:0,componentType:5126,count:pos.length/3,type:"VEC3",min:mn,max:mx},
      {bufferView:1,componentType:5126,count:nor.length/3,type:"VEC3"},{bufferView:2,componentType:5125,count:ix.length,type:"SCALAR"}]};
  let js=new TextEncoder().encode(JSON.stringify(json));const jl=Math.ceil(js.length/4)*4;
  const jb=new Uint8Array(jl).fill(32);jb.set(js);
  const total=12+8+jl+8+bin,out=new ArrayBuffer(total),dv=new DataView(out),u8=new Uint8Array(out);
  dv.setUint32(0,0x46546C67,true);dv.setUint32(4,2,true);dv.setUint32(8,total,true);
  dv.setUint32(12,jl,true);dv.setUint32(16,0x4E4F534A,true);u8.set(jb,20);
  let o=20+jl;dv.setUint32(o,bin,true);dv.setUint32(o+4,0x004E4942,true);o+=8;
  u8.set(new Uint8Array(pos.buffer,pos.byteOffset,pl),o);u8.set(new Uint8Array(nor.buffer,nor.byteOffset,nl),o+pl);
  u8.set(new Uint8Array(ix.buffer,ix.byteOffset,il),o+pl+nl);
  save(new Blob([out],{type:"model/gltf-binary"}),G.id+".glb");
}
document.getElementById("stl").onclick=exportSTL;
document.getElementById("glb").onclick=exportGLB;
/* ---------- extras ---------- */

const L={en:{h:"Height",rb:"Base radius",rm:"Belly radius",tm:"Belly height",rn:"Neck radius",rl:"Lip radius",ribs:"Ribs",rd:"Rib depth",tw:"Twist",wall:"Wall thickness",floor:"Floor thickness",res:"Sides",Amphora:"Amphora",Cylinder:"Cylinder",Bulb:"Bulb",Twisted:"Twisted",Fluted:"Fluted",wire:"Wireframe",spin:"Auto-rotate",cut:"Cross-section",over:"Show overhangs",glaze:"Glaze",copy:"Copy link",save:"Save design",load:"Load design",png:"Save PNG",eh:"Export height (mm)",stl:"Download STL",glb:"GLB",obj:"OBJ",undo:"Undo",redo:"Redo",rnd:"Randomize",tri:"triangles",w:"width",vol:"Volume",mass:"Solid PLA",ovl:"Overhang",light:"Light mode",dark:"Dark mode",copied:"Copied!",sShape:"Shape",sSurf:"Surface",sWalls:"Walls",sLook:"Look",sOut:"Export"},
cs:{h:"Výška",rb:"Poloměr podstavy",rm:"Poloměr bříška",tm:"Výška bříška",rn:"Poloměr krku",rl:"Poloměr okraje",ribs:"Žebra",rd:"Hloubka žeber",tw:"Zkroucení",wall:"Tloušťka stěny",floor:"Tloušťka dna",res:"Počet stran",Amphora:"Amfora",Cylinder:"Válec",Bulb:"Baňka",Twisted:"Zkroucená",Fluted:"Žlábkovaná",wire:"Drátový model",spin:"Automatické otáčení",cut:"Řez",over:"Zobrazit převisy",glaze:"Glazura",copy:"Kopírovat odkaz",save:"Uložit návrh",load:"Načíst návrh",png:"Uložit PNG",eh:"Výška při exportu (mm)",stl:"Stáhnout STL",glb:"GLB",obj:"OBJ",undo:"Zpět",redo:"Znovu",rnd:"Náhodně",tri:"trojúhelníků",w:"šířka",vol:"Objem",mass:"Plné PLA",ovl:"Převisy",light:"Světlý režim",dark:"Tmavý režim",copied:"Zkopírováno!",sShape:"Tvar",sSurf:"Povrch",sWalls:"Stěny",sLook:"Vzhled",sOut:"Export"}};
try{lang=localStorage.lang;theme=localStorage.theme}catch(e){}

theme=theme||"dark";
const t=k=>L[lang][k]||k,HT=()=>G.height(P),S=()=>(+eh.value||HT())/HT();
function tr(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));

  scene.background=new THREE.Color(theme==="light"?0xf7e9ef:0x07040a);grid.material.color.set(theme==="light"?0x8a2a55:0x3a1830);wm.color.set(theme==="light"?0x9c2a5e:0xff9cc4);
  try{localStorage.theme=theme}catch(e){}}
const WARN=new THREE.Color(0xe0533d);
mat.vertexColors=true;mat.color.set(0xffffff);
function paint(){
  const g=mesh.geometry,p=g.attributes.position.array,n=g.attributes.normal.array,c=new THREE.Color(glz.value),col=new Float32Array(p.length),N=p.length/3;let bad=0;
  for(let i=0;i<N;i++){const f=n[i*3+1]<-.707&&p[i*3+1]>.5;if(f)bad++;(f&&over.checked?WARN:c).toArray(col,i*3)}
  capM.color.copy(c).multiplyScalar(.6);g.setAttribute("color",new THREE.BufferAttribute(col,3));return bad/N}
function showInfo(){
  const g=mesh.geometry,p=g.attributes.position.array,ix=g.index.array;let v=0,mx=0;
  for(let f=0;f<ix.length;f+=3){const a=ix[f]*3,b=ix[f+1]*3,c=ix[f+2]*3;
    v+=(p[a]*(p[b+1]*p[c+2]-p[b+2]*p[c+1])+p[a+1]*(p[b+2]*p[c]-p[b]*p[c+2])+p[a+2]*(p[b]*p[c+1]-p[b+1]*p[c]))/6}
  for(let i=0;i<p.length;i+=3)mx=Math.max(mx,Math.abs(p[i]));
  const s=S(),cm=Math.abs(v)*s**3/1000;
  st.textContent=`${(ix.length/3).toLocaleString()} ${t("tri")} · ${t("w")} ${(2*mx*s).toFixed(0)} mm`;
  inf.textContent=`${t("vol")}: ${cm.toFixed(1)} cm³ · ${t("mass")}: ${(cm*1.24).toFixed(0)} g · ${t("ovl")}: ${(ovf*100).toFixed(0)} %`}
function snap(){const s=JSON.stringify(P);if(H[hi]===s)return;H=H.slice(0,hi+1);H.push(s);hi=H.length-1}
function go(d){const n=hi+d;if(n<0||n>=H.length)return;hi=n;Object.assign(P,JSON.parse(H[hi]));syncAll();refresh()}
function wireGeo(g){const p=g.attributes.position.array,ix=g.index.array,E=new Map(),d=(a,b)=>{const x=p[a*3]-p[b*3],y=p[a*3+1]-p[b*3+1],z=p[a*3+2]-p[b*3+2];return x*x+y*y+z*z};
  for(let f=0;f<ix.length;f+=3){const v=[ix[f],ix[f+1],ix[f+2]],l=[d(v[0],v[1]),d(v[1],v[2]),d(v[2],v[0])],m=l[0]>=l[1]&&l[0]>=l[2]?0:l[1]>=l[2]?1:2;
    for(let k=0;k<3;k++){const a=v[k],b=v[(k+1)%3],key=a<b?a*262144+b:b*262144+a;let e=E.get(key);if(!e){e={a,b,n:0,L:0};E.set(key,e)}e.n++;if(k===m)e.L++}}
  const out=[];E.forEach(e=>{if(e.n===2&&e.L===2)return;out.push(p[e.a*3],p[e.a*3+1],p[e.a*3+2],p[e.b*3],p[e.b*3+1],p[e.b*3+2])});
  const w=new THREE.BufferGeometry();w.setAttribute("position",new THREE.BufferAttribute(new Float32Array(out),3));return w}
function updWire(){LOW=true;const g=buildMesh();LOW=false;wf.geometry.dispose();wf.geometry=wireGeo(g);g.dispose()}
const plane=new THREE.Plane(new THREE.Vector3(0,0,-1),0);renderer.localClippingEnabled=true;
const stM=(side,op)=>new THREE.MeshBasicMaterial({depthWrite:false,depthTest:false,colorWrite:false,stencilWrite:true,stencilFunc:THREE.AlwaysStencilFunc,side,clippingPlanes:[plane],stencilFail:op,stencilZFail:op,stencilZPass:op});
const sb=new THREE.Mesh(mesh.geometry,stM(THREE.BackSide,THREE.IncrementWrapStencilOp)),sf=new THREE.Mesh(mesh.geometry,stM(THREE.FrontSide,THREE.DecrementWrapStencilOp));
sb.renderOrder=sf.renderOrder=1;mesh.add(sb);mesh.add(sf);
const capM=new THREE.MeshStandardMaterial({color:0xf08cb8,roughness:.6,metalness:0,stencilWrite:true,stencilRef:0,stencilFunc:THREE.NotEqualStencilFunc,stencilFail:THREE.ReplaceStencilOp,stencilZFail:THREE.ReplaceStencilOp,stencilZPass:THREE.ReplaceStencilOp});
const cap=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),capM);cap.renderOrder=1.1;cap.lookAt(0,0,1);cap.onAfterRender=r=>r.clearStencil();scene.add(cap);
mesh.renderOrder=6;wf.renderOrder=7;sb.visible=sf.visible=cap.visible=false;
$("cut").onchange=e=>{mat.clippingPlanes=wm.clippingPlanes=e.target.checked?[plane]:[];mat.needsUpdate=wm.needsUpdate=true;sb.visible=sf.visible=cap.visible=e.target.checked};
over.onchange=()=>{ovf=paint();showInfo()};
glz.oninput=paint;eh.oninput=showInfo;
sl.addEventListener("change",snap);$("presets").addEventListener("click",snap);

$("rnd").onclick=()=>{if(G.id!=="vase"){DEF.forEach(([k,,a,b,sp])=>{P[k]=+(Math.round((a+Math.random()*(b-a))/sp)*sp).toFixed(2)});syncAll();refresh();snap();return}const r=(a,b)=>Math.round(a+Math.random()*(b-a));
  Object.assign(P,{h:r(100,220),rb:r(22,50),rm:r(30,70),tm:+(.25+Math.random()*.35).toFixed(2),rn:r(16,45),rl:r(20,50),ribs:r(0,3)?r(3,24):0,rd:+(Math.random()*.15).toFixed(2),tw:r(-3,3)*60,wall:2.4,floor:3,res:Math.max(P.res,96)});
